name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  ui-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Install Playwright browser
        run: npx --yes --package @playwright/cli@0.1.18 playwright install --with-deps chromium
      - name: Initialize local database
        run: python -m backend.services.initialize_atlas --database data/atlas.db
      - name: Run UI smoke
        run: |
          python -m uvicorn backend.api.app:app --host 127.0.0.1 --port 8000 > /tmp/atlas_api.log 2>&1 &
          API_PID=$!
          ATLAS_API_URL=http://127.0.0.1:8000 python -m streamlit run app/dashboard/main.py --server.port 8501 --server.headless true > /tmp/streamlit.log 2>&1 &
          STREAMLIT_PID=$!
          trap 'kill $API_PID $STREAMLIT_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health >/dev/null
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8501 && break
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:8501
          set +e
          scripts/ui_smoke.sh > /tmp/ui_smoke.log 2>&1
          UI_EXIT=$?
          set -e
          if [ $UI_EXIT -ne 0 ]; then
            echo "=== ui_smoke.log ==="
            tail -200 /tmp/ui_smoke.log || true
            echo "=== streamlit.log ==="
            tail -200 /tmp/streamlit.log || true
            echo "=== atlas_api.log ==="
            tail -200 /tmp/atlas_api.log || true
            UI_B64="$(tail -120 /tmp/ui_smoke.log | base64 -w0 | head -c 8000)"
            STREAMLIT_B64="$(tail -120 /tmp/streamlit.log | base64 -w0 | head -c 4000)"
            API_B64="$(tail -120 /tmp/atlas_api.log | base64 -w0 | head -c 4000)"
            echo "::error file=scripts/ui_smoke.sh,title=UI smoke ui log::${UI_B64}"
            echo "::error file=app/dashboard/main.py,title=UI smoke streamlit log::${STREAMLIT_B64}"
            echo "::error file=backend/api/app.py,title=UI smoke api log::${API_B64}"
            exit $UI_EXIT
          fi
      - name: Upload UI smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-logs
          path: |
            /tmp/ui_smoke.log
            /tmp/streamlit.log
            /tmp/atlas_api.log
          if-no-files-found: warn
          retention-days: 7
